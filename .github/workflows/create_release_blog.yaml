name: Release Blog

on:
  workflow_call:
    inputs:
      release-subject:
        required: true
        type: string
      release-body:
        required: true
        type: string
      release-url:
        required: true
        type: string
      python-version:
        required: true
        type: string
        default: "3.11"
    secrets:
      onepass_token:
        description: "A access-token for 1password authorsation"
        required: true

jobs:
  blog-creating:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch release information
        id: release
        run: |
          echo "RELEASE_SUBJECT=${{ inputs.release-subject }}" >> $GITHUB_ENV
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo "${{ inputs.release-body }}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "RELEASE_URL=${{ inputs.release-url }}" >> $GITHUB_ENV

      - name: Configure 1Password Service Account
        uses: 1password/load-secrets-action/configure@v2
        with:
          service-account-token: ${{ secrets.onepass_token }}

      - name: Load Docker credentials
        id: load-credentials
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          GITHUB_TOKEN: "op://DevOps/Git PAT - Personal - GitHub Action/credential"

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: stonebo/stone-journey.github.io
          token: ${{ env.GITHUB_TOKEN }}
          path: hugo_blog
          ref: trunk

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"

      - name: Install dependency and generate new file
        run: |
          export PYTHONPATH="${PYTHONPATH}:${{ github.workspace }}"
          python -m pip install --upgrade pip
          pip install ures
          poetry run python .github/scripts/release_blog.py -p "URes" -v "${{ env.RELEASE_SUBJECT }}" -n "${{ env.RELEASE_BODY }}" -u "${{ env.RELEASE_URL }}" -o "hugo_blog"

      - name: Commit changes
        run: |
          cd hugo_blog
          git config --global user.email "github@stone-bo.com"
          git config --global user.name "Post Release Bot"
          git add ./content/posts/project
          git commit -m "docs(project): add new blog for ${{ env.RELEASE_SUBJECT }} of ures"
          git push
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

name: Semantic Release (Basic)
description: "Execute a basic release process, like bash or other scripts"
inputs:
  node-version:
    description: "NodeJS version"
    required: false
    default: "20"

runs:
  using: "composite"
  steps:
    - name: Setup NodeJS
      uses: stone-home/Action-Stone-DevOps/.github/actions/setup-nodejs@trunk
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run Testing
      shell: bash
      run: npm test

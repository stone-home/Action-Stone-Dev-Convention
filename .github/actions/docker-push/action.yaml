name: Docker Build and Push
description: "Build and push with Docker (hosted) or Kaniko (ARC kubernetes-mode, no Docker socket)"

inputs:
  registry:
    description: "Target registry: 'ghcr' or 'dockerhub'"
    required: false
    default: "ghcr"
  registry-username:
    description: "Registry username"
    required: false
    default: ""
  registry-password-path:
    description: "1Password secret path for registry token"
    required: false
    default: "op://DevOps/Docker PAT - Git Action/credential"
  onepass-token:
    description: "OnePassword service account token"
    required: true
  kubernetes-mode:
    description: "true = Kaniko in container (no Docker). Job must use gcr.io/kaniko-project/executor:*-debug"
    required: false
    default: "false"
  image-name:
    description: "Full image ref without tag (e.g. ghcr.io/owner/repo)."
    required: false
    default: ""
  dockerfile:
    description: "Dockerfile path relative to repo root"
    required: false
    default: "Dockerfile"
  context:
    description: "Build context path relative to repo root"
    required: false
    default: "."
  tags:
    description: "Comma-separated tag suffixes (e.g. latest,v1.0.0)"
    required: false
    default: "latest"

# ===========================================================================
# Required Permission
# contents: read (checkout)
# packages: write (push to GHCR)
# ===========================================================================

runs:
  using: composite
  steps:
    # The fnctl64 missing issue occurs in kubernetes mode only (at least in my case)
    - name: Native Git Checkout (avoids fnctl64 missing issue in post checkout steps)
      if: ${{ inputs.kubernetes-mode == 'true' }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
        REPO_URL: github.com/${{ github.repository }}.git
        BRANCH: ${{ github.ref_name }}
      shell: bash
      run: |
        # Trust the default GitHub Actions workspace directory
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

        # Clone the specific branch using the automatic token
        # github.ref_name supports both workflow_dispatch and push events
        git clone --single-branch --branch "$BRANCH" "https://x-access-token:${GITHUB_TOKEN}@${REPO_URL}" .

        # Optional validation
        git log -1 --format="Checked out commit: %H"
    - name: Set image name and tags
      id: image
      shell: bash
      run: |
        set -euo pipefail
        name="${{ inputs.image-name }}"
        if [ -z "$name" ] && [ "${{ inputs.registry }}" = "ghcr" ]; then
          name="ghcr.io/${{ github.repository }}"
        fi
        if [ "${{ inputs.registry }}" = "ghcr" ]; then
          name=$(echo "$name" | tr '[:upper:]' '[:lower:]')
        fi
        echo "name=$name" >> "$GITHUB_OUTPUT"
        tags_in="${{ inputs.tags }}"
        tags_full=""
        IFS=',' read -ra TARR <<< "$tags_in"
        for t in "${TARR[@]}"; do
          t=$(echo "$t" | xargs)
          [ -z "$t" ] && continue
          tags_full="${tags_full}${name}:${t},"
        done
        tags_full="${tags_full%,}"
        [ -z "$tags_full" ] && tags_full="${name}:latest"
        echo "tags=${tags_full}" >> "$GITHUB_OUTPUT"

    - name: Setup 1Password
      uses: stone-home/Action-Stone-DevOps/.github/actions/setup-1password@trunk
      with:
        onepass-token: ${{ inputs.onepass-token }}
        kubernetes-mode: ${{ inputs.kubernetes-mode }}

    - name: Get Registry token
      id: get-registry-token
      uses: stone-home/Action-Stone-DevOps/.github/actions/load-github-token@trunk
      with:
        secret-path: ${{ inputs.registry-password-path }}
        kubernetes-mode: ${{ inputs.kubernetes-mode }}
        onepass-token: ${{ inputs.onepass-token }}

    - name: Log in to GitHub Container Registry
      if: inputs.registry == 'ghcr' && inputs.kubernetes-mode != 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ inputs.registry-username }}
        password: ${{ steps.get-registry-token.outputs.token }}

    - name: Log in to Docker Hub
      if: inputs.registry == 'dockerhub' && inputs.kubernetes-mode != 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.registry-username }}
        password: ${{ steps.get-registry-token.outputs.token }}

    - name: Build and push Docker image
      if: inputs.kubernetes-mode != 'true'
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: true
        tags: ${{ steps.image.outputs.tags }}

    - name: Build and push (Kaniko, no Docker daemon)
      if: inputs.kubernetes-mode == 'true'
      shell: sh
      env:
        REGISTRY: ${{ inputs.registry }}
        REG_USER: ${{ inputs.registry-username }}
        REG_PASS: ${{ steps.get-registry-token.outputs.token }}
        TAGS_FULL: ${{ steps.image.outputs.tags }}
        BUILD_CONTEXT: ${{ inputs.context }}
        DOCKERFILE_PATH: ${{ inputs.dockerfile }}
      run: |
        set -eu
        if [ ! -x /kaniko/executor ]; then
          echo "::error::kubernetes-mode needs Kaniko at /kaniko/executor. Plain ubuntu:24.04 has no Docker and no Kaniko — see Dockerfile.arc-ubuntu-kaniko.example in this folder."
          exit 1
        fi

        ws="${GITHUB_WORKSPACE}"
        ctx=$(cd "$ws" && realpath "${BUILD_CONTEXT:-.}")
        df=$(cd "$ws" && realpath "$DOCKERFILE_PATH")
        case "$df" in
          "$ctx"/*) rel="${df#"$ctx"/}";;
          *)
            echo "::error::Dockerfile must be inside the build context ($BUILD_CONTEXT)."
            exit 1
            ;;
        esac

        export DOCKER_CONFIG="/tmp/kaniko-docker-config"
        rm -rf "$DOCKER_CONFIG"
        mkdir -p "$DOCKER_CONFIG"
        if [ "$REGISTRY" = "ghcr" ]; then
          key="ghcr.io"
        else
          key="https://index.docker.io/v1/"
        fi
        if [ -z "${REG_USER:-}" ] || [ -z "${REG_PASS:-}" ]; then
          echo "::error::registry-username and registry token are required for Kaniko push."
          exit 1
        fi
        b64=$(printf '%s:%s' "$REG_USER" "$REG_PASS" | base64 -w0 2>/dev/null || printf '%s:%s' "$REG_USER" "$REG_PASS" | base64 | tr -d '\n')
        printf '%s\n' "{\"auths\":{\"${key}\":{\"auth\":\"${b64}\"}}}" > "$DOCKER_CONFIG/config.json"

        # Kaniko v1.24+: no --push (push is default when --destination is set; use --no-push to disable).
        # Save IFS before the loop; do not put '\' after --dockerfile if the next line is an assignment
        # (backslash would continue the line and merge oifs= into the set -- command).
        _ifs_save=$IFS
        set -- \
          --context="dir://${ctx}" \
          --dockerfile="$rel"
        IFS=,
        for d in $TAGS_FULL; do
          d=$(echo "$d" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          [ -z "$d" ] && continue
          set -- "$@" --destination="$d"
        done
        IFS=$_ifs_save
        exec /kaniko/executor "$@"

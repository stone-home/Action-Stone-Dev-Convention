name: "Setup NodeJS"
description: "Configures NodeJS Runtime"
inputs:
  node-version:
    description: "NodeJS version"
    required: false
    default: "22"
  install-dependencies:
    description: "Whether to install dependencies using npm ci"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      if: ${{ inputs.install-dependencies == 'true' }}
      shell: bash
      run: npm ci

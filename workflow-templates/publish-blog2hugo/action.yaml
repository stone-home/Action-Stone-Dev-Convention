name: Workflow-Release Blog

on:
  workflow_call:
    inputs:
      release-subject:
        required: true
        type: string
      release-body:
        required: true
        type: string
      release-url:
        required: true
        type: string
      python-version:
        required: true
        type: string
        default: "3.11"
      project-name:
        required: true
        type: string
      hero-image:
        required: false
        type: string
        default: "/images/posts/hero/project-release.jpeg"
      github-token-path:
        required: false
        type: string
        default: "op://DevOps/Git PAT - Personal - GitHub Action/credential"
    secrets:
      onepass-token:
        description: "A access-token for 1password authorsation"
        required: true

jobs:
  blog-creating:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch release information
        id: release
        run: |
          echo "RELEASE_SUBJECT=${{ inputs.release-subject }}" >> $GITHUB_ENV
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo "${{ inputs.release-body }}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "RELEASE_URL=${{ inputs.release-url }}" >> $GITHUB_ENV

      - name: Setup 1Password
        uses: stone-home/Action-Stone-DevOps/.github/actions/setup-1password@trunk
        with:
          onepass-token: ${{ secrets.onepass-token }}

      - name: Get Personal Token
        id: get-token
        uses: stone-home/Action-Stone-DevOps/.github/actions/load-github-token@trunk
        with:
          secret-path: ${{ inputs.github-token-path }}

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: stonebo/stone-journey.github.io
          token: ${{ steps.get-token.outputs.token }}
          path: hugo_blog
          ref: trunk

      - name: Checkout DevOps repository
        uses: actions/checkout@v4
        with:
          repository: stone-home/Action-Stone-DevOps
          token: ${{ steps.get-token.outputs.token }}
          path: devops_repo
          ref: trunk

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependency and generate new file
        run: |
          export PYTHONPATH="${PYTHONPATH}:${{ github.workspace }}"
          python -m pip install --upgrade pip
          pip install ures
          python devops_repo/scripts/release_blog.py \
          -p "${{ inputs.project-name }}" \
          -v "${{ env.RELEASE_SUBJECT }}" \
          -n "${{ env.RELEASE_BODY }}" \
          -u "${{ env.RELEASE_URL }}" \
          -o "hugo_blog" \
          --hero "${{ inputs.hero-image}}"

      - name: Commit changes
        run: |
          cd hugo_blog
          git config --global user.email "github@stone-bo.com"
          git config --global user.name "Blog Creation Bot"
          git add ./content/posts/project
          git commit -m "docs(project): add new blog for ${{ env.RELEASE_SUBJECT }} of ${{ inputs.project-name }}"
          git push
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

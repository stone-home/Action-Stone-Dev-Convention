name: Semantic Release (Node)
on:
  workflow_call:
    inputs:
      github-token-path:
        required: false
        type: string
        default: "op://DevOps/Git PAT - StoneHome - Action/credential"
    secrets:
      onepass-token:
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20 # Upgraded to LTS

      - name: Setup 1Password
        uses: stone-home/Action-Stone-DevOps/.github/actions/setup-1password@trunk
        with:
          onepass-token: ${{ secrets.onepass-token }}

      - name: Get Bot Token
        id: get-token
        uses: stone-home/Action-Stone-DevOps/.github/actions/load-github-token@trunk
        with:
          secret-path: ${{ inputs.github-token-path }}

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Semantic Release
        run: npx semantic-release@21.0.2
        env:
          GITHUB_TOKEN: ${{ steps.get-token.outputs.token }}

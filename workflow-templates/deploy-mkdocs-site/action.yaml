name: Deploy MkDocs Site

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.11"
      poetry-version:
        required: false
        type: string
        default: "1.8.5"
      github-token-path:
        required: false
        type: string
        default: "op://DevOps/Git PAT - StoneHome - Action/credential"
    secrets:
      onepass-token:
        required: true

permissions:
  contents: read

jobs:
  mkdocs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python and Poetry
        uses: stone-home/Action-Stone-DevOps/.github/actions/setup-poetry
        with:
          python-version: ${{ inputs.python-version }}
          poetry-version: ${{ inputs.poetry-version }}

      - name: Build Site
        run: poetry run mkdocs build

      - name: Configure 1Password Service Account
        uses: stone-home/Action-Stone-DevOps/.github/actions/setup-1password
        with:
          onepass-token: ${{ secrets.onepass-token }}

      - name: Get Personal Token
        id: get-token
        uses: stone-home/Action-Stone-DevOps/.github/actions/load-github-token@trunk
        with:
          secret-path: ${{ inputs.github-token-path }}

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ steps.get-token.outputs.token }}
          publish_branch: gh-pages
          publish_dir: ./site
